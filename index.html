<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Basketball Scoreboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS -->
    <link rel="stylesheet" href="./src/css/style.css" />

    <!--CSS blocks-->
    <link rel="stylesheet" href="./src/css/blocks/scoreboard/scoreboard.css" />
    <link rel="stylesheet" href="./src/css/blocks/score/score.css" />
    <link rel="stylesheet" href="./src/css/blocks/btn/btn.css" />
  </head>

  <body>
    <main>
      <h1 class="sr-only">Basketball Scoreboard</h1>
      <section class="scoreboard">
        <p class="scoreboard__announcement">Time left: 60</p>
        <div class="scoreboard__scores">
          <div class="score">
            <h2 class="score__title">Home</h2>
            <p class="score__count">0</p>
            <div class="score__btns">
              <button class="btn">+1</button>
              <button class="btn">+2</button>
              <button class="btn">+3</button>
            </div>
          </div>
          <div class="score">
            <h2 class="score__title">Guest</h2>
            <p class="score__count">0</p>
            <div class="score__btns">
              <button class="btn">+1</button>
              <button class="btn">+2</button>
              <button class="btn">+3</button>
            </div>
          </div>
        </div>
        <button class="btn">New Game</button>
      </section>
    </main>
  </body>
</html>
